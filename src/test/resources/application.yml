spring:
  # H2 Setting Info (H2 Console에 접속하기 위한 설정정보 입력)
  h2:
    console:
      enabled: true  # H2 Console을 사용할지 여부 (H2 Console은 H2 Database를 UI로 제공해주는 기능)
      path: /h2-console  # H2 Console의 Path
  # Database Setting Info (Database를 H2로 사용하기 위해 H2연결 정보 입력)
  datasource:
    driver-class-name: org.h2.Driver  # Database를 H2로 사용하겠다.
    url: jdbc:h2:tcp://localhost/~/test  # H2 접속 정보
    username: sa  # H2 접속 시 입력할 username 정보 (원하는 것으로 입력)
    password: 4231  # H2 접속 시 입력할 password 정보 (원하는 것으로 입력)


  jwt:
    secret: eliceproject2eliceproject2eliceproject2eliceproject2



  # spring data jpa 설정
  jpa:
    hibernate:
      ddl-auto: update # create 처음 실행시 sql 테이블 생성 이후에는 none 으로 설정
    show-sql: true
    defer-datasource-initialization: true