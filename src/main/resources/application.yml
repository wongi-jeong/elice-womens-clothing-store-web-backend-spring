# database 연동 설정
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shoppingmall # 자신의 환경에 맞게 변경 가능

    username: root # 자신의 환경에 맞게 변경 가능
    password: 1234 # 자신의 환경에 맞게 변경 가능

  mvc:
    static-path-pattern: /images/**
  web:
    resources:
      static-locations: classpath:/static/images/
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  jackson:
    default-property-inclusion: non_null # DTO에서 null 값인 필드 전송 안됨

  # spring data jpa 설정
  jpa:
    hibernate:
      ddl-auto: update # create 처음 실행시 sql 테이블 생성 이후에는 none 으로 설정
    show-sql: true
    defer-datasource-initialization: true
    open-in-view: false

    jackson:
      default-property-inclusion: non_null

  #-----------------------------------시큐리티 설정-------------------------------------------------------------------------------
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver # 서비스명
            client-id: 9Q8c9IK6So2HtQXhhMIS # 서비스에서 발급 받은 아이디
            client-secret: ZFnuZ3iXqe # 서비스에서 발급 받은 비밀번호
            redirect-uri: http://localhost:8080/login/oauth2/code/naver # 서비스에 등록한 우리쪽 로그인 성공 URI
            authorization-grant-type: authorization_code
            scope: name,email # 리소스 서버에서 가져올 데이터 범위
          google:
            client-name: google
            client-id: 181344558022-tklb4961ssfqrap4v8i9uiqjo0v0mqmn.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: profile,email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # 서비스 로그인 창 주소
            token-uri: https://nid.naver.com/oauth2.0/token # 토큰 발급 서버 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me # 사용자 정보 획득 주소
            user-name-attribute: response # 응답 데이터 변수
  #-------------------------------- jwt 설정 ---------------------------------------------------
